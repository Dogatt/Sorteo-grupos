<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo de Grupos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            color: white;
            transition: background-color 0.5s ease;
            padding: 1rem;
            background-color: #333;
            overflow: hidden;
        }

        h1 {
            font-size: clamp(1.2rem, 5vw, 2rem);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
            letter-spacing: 0.1em;
            text-align: center;
            margin-bottom: 0.5rem;
            opacity: 0;
            animation: fadeDown 0.6s ease 0.2s forwards;
        }

        #grupo {
            font-size: clamp(6rem, 38vw, 15rem);
            font-weight: bold;
            text-shadow: 6px 6px 20px rgba(0,0,0,0.35);
            line-height: 1;
            opacity: 0;
            transform: scale(0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s forwards;
            text-align: center;
        }

        #subtitulo {
            font-size: clamp(0.85rem, 3vw, 1rem);
            margin-top: 1.5rem;
            opacity: 0;
            letter-spacing: 0.05em;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
            text-align: center;
            animation: fadeUp 0.6s ease 1s forwards;
        }

        /* Animación del dedo "nono" */
        #dedo {
            display: none;
            font-size: clamp(3rem, 15vw, 6rem);
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            transform-origin: bottom center;
            animation: nono 0.4s ease-in-out infinite alternate;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.4));
        }

        .confeti {
            position: fixed;
            top: -20px;
            border-radius: 2px;
            animation: caer linear forwards;
            opacity: 0.85;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 0.8; transform: translateY(0); }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5) rotate(-5deg); }
            to   { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes caer {
            0%   { top: -20px; opacity: 0.9; }
            100% { top: 110vh; opacity: 0; }
        }
        @keyframes nono {
            from { transform: rotate(-25deg); }
            to   { transform: rotate(25deg); }
        }
    </style>
</head>
<body>
    <div id="dedo">☝️</div>
    <h1 id="titulo">TU GRUPO ES:</h1>
    <div id="grupo"></div>
    <p id="subtitulo">¡Busca a tus compañeros de grupo!</p>

    <script>
        const colores = [
            "#E63946", "#F4A261", "#E9C46A", "#2A9D8F", "#264653",
            "#8338EC", "#FF006E", "#3A86FF", "#00B4D8", "#0077B6",
            "#9D4EDD", "#F15BB5", "#00F5D4", "#FFD700", "#ADFF2F"
        ];

        function lanzarConfeti(color) {
            const formas = ["●", "■", "▲", "★", "♦"];
            for (let i = 0; i < 60; i++) {
                const el = document.createElement("div");
                el.classList.add("confeti");
                el.innerText = formas[Math.floor(Math.random() * formas.length)];
                el.style.left = Math.random() * 100 + "vw";
                el.style.color = i % 3 === 0 ? "white" : color;
                el.style.fontSize = (Math.random() * 14 + 8) + "px";
                el.style.animationDuration = (Math.random() * 2 + 1.5) + "s";
                el.style.animationDelay = (Math.random() * 0.8) + "s";
                document.body.appendChild(el);
                el.addEventListener("animationend", () => el.remove());
            }
        }

        function asignar() {
            let numero = localStorage.getItem('grupo_usuario');

            if (!numero) {
                // Primera vez: sortear y guardar
                numero = Math.floor(Math.random() * 15) + 1;
                localStorage.setItem('grupo_usuario', numero);

                const color = colores[numero - 1];
                document.getElementById('grupo').innerText = numero;
                document.body.style.backgroundColor = color;
                setTimeout(() => lanzarConfeti(color), 500);

            } else {
                // Ya tiene grupo: mostrar info y el dedo
                const color = colores[numero - 1];
                document.getElementById('grupo').innerText = numero;
                document.body.style.backgroundColor = color;
                document.getElementById('subtitulo').innerText = "¡Ya tienes tu grupo asignado!";
                document.getElementById('titulo').innerText = "TU GRUPO SIGUE SIENDO:";

                // Mostrar el dedo animado
                document.getElementById('dedo').style.display = 'block';
            }
        }

        window.onload = asignar;
    </script>
</body>
</html>
